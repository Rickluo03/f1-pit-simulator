<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 賽車進站策略模擬器</title>
    <style>
        /* ====== 全域變數與主題色 ====== */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #00e5ff;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --soft-tire: #ff4d4d;
            --medium-tire: #ffd633;
            --hard-tire: #f5f6fa;
        }

        /* ====== 基本排版 ====== */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: var(--surface-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
            margin-bottom: 30px;
        }
        h2 {
            font-size: 1.2rem;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-top: 0;
        }

        /* ====== 控制面板區 ====== */
        .settings-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            flex: 1;
            min-width: 300px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #1a1a1a;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        input:focus, select:focus {
            border-color: var(--primary-color);
        }
        
        button {
            background-color: var(--primary-color);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }
        button:hover {
            background-color: #00b8cc;
            transform: translateY(-2px);
        }
        .btn-danger {
            background-color: #ff4d4d;
            color: white;
        }
        .btn-danger:hover {
            background-color: #cc0000;
        }

        /* 進站設定列表 */
        .pit-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
            background: #222;
            padding: 10px;
            border-radius: 6px;
        }
        .pit-row label { margin: 0; padding-right: 5px; }
        .pit-row input { width: 80px; margin: 0; }
        .pit-row select { flex: 1; margin: 0; }
        .pit-row button { width: auto; margin: 0; padding: 10px 15px; }

        /* ====== 結果顯示區 ====== */
        .total-time-display {
            font-size: 3rem;
            text-align: center;
            font-weight: bold;
            color: var(--primary-color);
            margin: 20px 0;
            font-family: monospace;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        
        .track-info {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        /* 視覺化圖表 */
        .chart-wrapper {
            width: 100%;
            overflow-x: auto;
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .chart {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 250px;
            min-width: min-content;
        }
        .bar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            width: 28px;
        }
        .bar {
            width: 100%;
            border-radius: 4px 4px 0 0;
            transition: height 0.3s ease, filter 0.2s;
            position: relative;
            cursor: pointer;
        }
        .bar:hover {
            filter: brightness(1.5);
        }
        .bar:hover::after {
            content: attr(data-info);
            position: absolute;
            bottom: calc(100% + 5px);
            left: 50%;
            transform: translateX(-50%);
            background-color: #000;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            white-space: nowrap;
            z-index: 10;
            border: 1px solid #444;
        }
        .lap-num {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 8px;
            height: 15px;
        }

        @media (max-width: 600px) {
            .total-time-display { font-size: 2.2rem; }
            .pit-row { flex-wrap: wrap; }
            .pit-row input, .pit-row select, .pit-row button { width: 100%; flex: none; margin-bottom: 5px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>F1 進站策略模擬器</h1>
        
        <div class="settings-panel">
            <!-- 基礎設定面板 -->
            <div class="card">
                <h2>🏎️ 賽事基礎設定</h2>
                
                <label for="trackSelect">選擇賽道 (Track)</label>
                <select id="trackSelect">
                    <option value="monza">🇮🇹 義大利 Monza (高速/低磨耗/進站耗時長)</option>
                    <option value="silverstone" selected>🇬🇧 英國 Silverstone (中速/高磨耗/進站耗時中)</option>
                    <option value="monaco">🇲🇨 摩納哥 Monaco (低速/極低磨耗/進站耗時短)</option>
                </select>

                <label for="totalLaps">總圈數 (Laps)</label>
                <input type="number" id="totalLaps" value="50" min="10" max="100">
                
                <label for="startTire">起跑輪胎 (Starting Tire)</label>
                <select id="startTire">
                    <option value="soft">🔴 軟胎 Soft (速度快，衰退快)</option>
                    <option value="medium" selected>🟡 中性胎 Medium (性能平衡)</option>
                    <option value="hard">⚪ 硬胎 Hard (速度慢，衰退慢)</option>
                </select>
            </div>
            
            <!-- 進站策略面板 -->
            <div class="card">
                <h2>🔧 進站換胎策略 (Pit Stops)</h2>
                <div id="pitStopsContainer"></div>
                <button id="addPitBtn" style="margin-top: 10px;">+ 新增進站點</button>
            </div>
        </div>

        <!-- 結果與數據圖表面板 -->
        <div class="results">
            <h2>⏱️ 預估完賽總時間</h2>
            <div class="track-info" id="trackInfoDisplay"></div>
            <div class="total-time-display" id="totalTimeDisplay">00:00.000</div>
            
            <h2>📊 單圈時間視覺化</h2>
            <p style="font-size: 0.9rem; color: #a0a0a0; margin-top: -5px;">
                💡 採用絕對時間比例。長條越高代表該圈耗時越長。進站圈會增高。滑鼠移至長條可查看單圈數據。
            </p>
            <div class="chart-wrapper">
                <div class="chart" id="chart"></div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 賽道與輪胎參數設定 ---
        const tracks = {
            monza: { 
                name: '義大利 Monza', baseTime: 82, pitLoss: 25, degMultiplier: 0.8 
            },
            silverstone: { 
                name: '英國 Silverstone', baseTime: 88, pitLoss: 22, degMultiplier: 1.3 
            },
            monaco: { 
                name: '摩納哥 Monaco', baseTime: 72, pitLoss: 20, degMultiplier: 0.5 
            }
        };

        // 輪胎改為相對於賽道基準時間的偏移量 (offset)
        const tireSpecs = {
            soft:   { offset: -2.0, degradation: 0.15, color: 'var(--soft-tire)' },
            medium: { offset: 0.0,  degradation: 0.08, color: 'var(--medium-tire)' },
            hard:   { offset: 1.5,  degradation: 0.04, color: 'var(--hard-tire)' }
        };

        let pitStops = []; 

        // --- 2. 抓取 DOM 元素 ---
        const ui = {
            trackSelect: document.getElementById('trackSelect'),
            totalLaps: document.getElementById('totalLaps'),
            startTire: document.getElementById('startTire'),
            pitContainer: document.getElementById('pitStopsContainer'),
            addBtn: document.getElementById('addPitBtn'),
            totalTime: document.getElementById('totalTimeDisplay'),
            trackInfo: document.getElementById('trackInfoDisplay'),
            chart: document.getElementById('chart')
        };

        // --- 3. 綁定事件監聽 ---
        ui.trackSelect.addEventListener('change', runSimulation);
        ui.totalLaps.addEventListener('input', runSimulation);
        ui.startTire.addEventListener('change', runSimulation);
        
        ui.addBtn.addEventListener('click', () => {
            const defaultLap = pitStops.length > 0 ? pitStops[pitStops.length-1].lap + 15 : 15;
            pitStops.push({ lap: defaultLap, tire: 'hard' });
            renderPitUI();
            runSimulation();
        });

        // --- 4. UI 渲染功能 ---
        function renderPitUI() {
            ui.pitContainer.innerHTML = '';
            pitStops.forEach((pit, index) => {
                const row = document.createElement('div');
                row.className = 'pit-row';
                row.innerHTML = `
                    <label>第</label>
                    <input type="number" min="2" max="100" value="${pit.lap}" onchange="updatePit(${index}, 'lap', this.value)">
                    <label>圈換上</label>
                    <select onchange="updatePit(${index}, 'tire', this.value)">
                        <option value="soft" ${pit.tire === 'soft' ? 'selected' : ''}>🔴 軟胎</option>
                        <option value="medium" ${pit.tire === 'medium' ? 'selected' : ''}>🟡 中性胎</option>
                        <option value="hard" ${pit.tire === 'hard' ? 'selected' : ''}>⚪ 硬胎</option>
                    </select>
                    <button class="btn-danger" onclick="removePit(${index})">刪除</button>
                `;
                ui.pitContainer.appendChild(row);
            });
        }

        window.updatePit = function(index, field, value) {
            pitStops[index][field] = field === 'lap' ? parseInt(value) : value;
            runSimulation();
        };

        window.removePit = function(index) {
            pitStops.splice(index, 1);
            renderPitUI();
            runSimulation();
        };

        function formatTime(totalSeconds) {
            const m = Math.floor(totalSeconds / 60);
            const s = Math.floor(totalSeconds % 60);
            const ms = Math.floor((totalSeconds % 1) * 1000);
            return `${m}:${s.toString().padStart(2, '0')}.${ms.toString().padStart(3, '0')}`;
        }

        // --- 5. 核心運算引擎 ---
        function runSimulation() {
            const totalLaps = parseInt(ui.totalLaps.value) || 50;
            const currentTrack = tracks[ui.trackSelect.value];
            let currentTire = ui.startTire.value;
            let tireAge = 0; 
            let totalRaceSeconds = 0;
            const lapData = [];

            ui.trackInfo.textContent = `當前賽道：${currentTrack.name} | 基準圈速：${currentTrack.baseTime}秒 | 進站耗時：${currentTrack.pitLoss}秒`;

            const pitMap = {};
            pitStops.forEach(p => { pitMap[p.lap] = p.tire; });

            for (let lap = 1; lap <= totalLaps; lap++) {
                let isPitLap = false;
                
                if (pitMap[lap]) {
                    currentTire = pitMap[lap];
                    tireAge = 0; 
                    isPitLap = true;
                }

                const specs = tireSpecs[currentTire];
                
                // 單圈時間 = 賽道基準 + 輪胎初始落差 + (輪胎使用圈數 * 基礎衰退 * 賽道磨耗加成)
                let lapTime = currentTrack.baseTime + specs.offset + (tireAge * specs.degradation * currentTrack.degMultiplier);
                
                if (isPitLap) {
                    lapTime += currentTrack.pitLoss;
                }

                totalRaceSeconds += lapTime;
                
                lapData.push({
                    lap: lap,
                    time: lapTime,
                    tire: currentTire,
                    isPitLap: isPitLap,
                    color: specs.color
                });

                tireAge++; 
            }

            ui.totalTime.textContent = formatTime(totalRaceSeconds);
            renderChart(lapData);
        }

        // --- 6. 繪製動態長條圖 ---
        function renderChart(lapData) {
            ui.chart.innerHTML = ''; 
            if(lapData.length === 0) return;

            // 修正比例：Y 軸基準線改為 0，讓長度完全對應真實時間比例
            const maxTime = Math.max(...lapData.map(d => d.time));

            lapData.forEach(data => {
                const container = document.createElement('div');
                container.className = 'bar-container';

                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.backgroundColor = data.color;
                
                // 真實比例計算 (最高的一根設定為 100% 高度)
                let heightPercent = (data.time / maxTime) * 100;
                bar.style.height = heightPercent + '%';
                
                let tireName = data.tire === 'soft' ? '🔴 軟胎' : (data.tire === 'medium' ? '🟡 中性胎' : '⚪ 硬胎');
                let info = `第 ${data.lap} 圈 | ${formatTime(data.time)} | ${tireName}`;
                if(data.isPitLap) info += ' (進站 🛠️)';
                bar.setAttribute('data-info', info);

                const lapLabel = document.createElement('div');
                lapLabel.className = 'lap-num';
                lapLabel.textContent = (data.lap % 5 === 0 || data.isPitLap || data.lap === 1) ? data.lap : '';

                container.appendChild(bar);
                container.appendChild(lapLabel);
                ui.chart.appendChild(container);
            });
        }

        // 初始化
        renderPitUI();
        runSimulation();
    </script>
</body>
</html>
